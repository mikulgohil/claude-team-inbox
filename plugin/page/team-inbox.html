<title>Team Inbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a pigeonhole ledger. A rail of mail slots (views with counts) sits beside one column of rows; an ask opens as a full sheet in that column. Docs: ../reference/protocol.md */
:root {
  --paper: #EEF1F5;
  --sheet: #FFFFFF;
  --sheet-2: #F6F8FA;
  --ink: #18202B;
  --ink-2: #485365;
  --ink-3: #626D7D;
  --rule: #D5DBE3;
  --stamp: #1F45B5;
  --stamp-ink: #FFFFFF;
  --stamp-soft: #E3E9FA;
  --block: #B8322A;
  --block-soft: #FBE6E3;
  --ok: #23784A;
  --ok-soft: #E1F2E8;
  --wait: #8A5A08;
  --wait-soft: #FAEFD9;
  --shadow: 0 1px 2px rgba(24, 32, 43, .06), 0 8px 24px rgba(24, 32, 43, .08);
  --font-text: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141A; --sheet: #171C24; --sheet-2: #1D232D; --ink: #E5E9EF; --ink-2: #B3BCC9; --ink-3: #8F9AAA;
    --rule: #2A323E; --stamp: #86A2FF; --stamp-ink: #0E1530; --stamp-soft: #1E2A4A; --block: #FF8578; --block-soft: #3A1E1C;
    --ok: #62C98E; --ok-soft: #173326; --wait: #E3B25A; --wait-soft: #33290F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141A; --sheet: #171C24; --sheet-2: #1D232D; --ink: #E5E9EF; --ink-2: #B3BCC9; --ink-3: #8F9AAA;
  --rule: #2A323E; --stamp: #86A2FF; --stamp-ink: #0E1530; --stamp-soft: #1E2A4A; --block: #FF8578; --block-soft: #3A1E1C;
  --ok: #62C98E; --ok-soft: #173326; --wait: #E3B25A; --wait-soft: #33290F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--font-text); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
a { color: var(--stamp); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: .86em; letter-spacing: .01em; }
.muted { color: var(--ink-3); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 600 1.25rem/1 var(--font-head); letter-spacing: .01em; }
.brand span { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .9rem; }
.me .av { width: 26px; height: 26px; }
.av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; background: var(--sheet-2); }
.avail { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.avail.busy { background: var(--wait); }
.avail.away { background: var(--ink-3); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; font-weight: 500; font-size: .92rem; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--stamp); border-color: var(--stamp); color: var(--stamp-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--block); }
.btn.small { padding: 4px 9px; font-size: .84rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--stamp); cursor: pointer; font-weight: 500; }

/* frame */
.frame { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; }
nav.rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); color: var(--ink-2); text-decoration: none; font-weight: 500; }
.slot:hover { background: var(--sheet); color: var(--ink); }
.slot[aria-current="page"] { background: var(--sheet); color: var(--ink); box-shadow: inset 3px 0 0 var(--stamp); }
.slot .n { margin-left: auto; font: 500 .82rem var(--font-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.slot .n.hot { color: var(--block); }
.rail hr { border: 0; border-top: 1px solid var(--rule); margin: 10px 0; width: 100%; }
main { min-width: 0; }
@media (max-width: 760px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 48px; }
  nav.rail { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .slot { white-space: nowrap; padding: 6px 10px; }
  .rail hr { display: none; }
  .me .who { display: none; }
}

/* view head */
.vhead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.vhead h1 { font: 600 1.7rem/1.1 var(--font-head); margin: 0; text-wrap: balance; letter-spacing: .005em; }
.vhead p { margin: 4px 0 0; color: var(--ink-3); max-width: 62ch; }
.vhead .spacer { min-width: 8px; }

/* rows */
.ledger { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: 4px 74px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 14px 11px 0; border-top: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--sheet-2); }
.stripe { align-self: stretch; background: transparent; }
.kind-blocker .stripe { background: var(--block); }
.code { color: var(--ink-3); padding-left: 10px; }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { color: var(--ink-3); font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-side { display: flex; align-items: center; gap: 10px; }
.age { color: var(--ink-3); min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--stamp); }
.overdue .age { color: var(--block); font-weight: 500; }
@media (max-width: 560px) {
  .row { grid-template-columns: 4px minmax(0, 1fr) auto; }
  .row .code { display: none; }
  .row-main { padding-left: 10px; }
  .row-side .chip { display: none; }
}

/* chips and tags */
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 .74rem/1 var(--font-text); text-transform: uppercase; letter-spacing: .06em; padding: 4px 7px; border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.chip.open { border-color: var(--stamp); color: var(--stamp); }
.chip.claimed { background: var(--stamp-soft); border-color: transparent; color: var(--stamp); }
.chip.answered { background: var(--wait-soft); border-color: transparent; color: var(--wait); }
.chip.resolved { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.cancelled { color: var(--ink-3); text-decoration: line-through; }
.tag { font: 600 .7rem/1 var(--font-text); text-transform: uppercase; letter-spacing: .07em; padding: 3px 5px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
.tag-block { background: var(--block-soft); color: var(--block); }
.tag-kind { background: var(--sheet-2); color: var(--ink-2); }
.tag-demo { background: var(--stamp-soft); color: var(--stamp); }

/* states */
.empty { padding: 36px 24px; text-align: left; background: var(--sheet); border: 1px dashed var(--rule); border-radius: var(--radius); color: var(--ink-2); }
.empty b { display: block; font: 600 1.05rem var(--font-head); color: var(--ink); margin-bottom: 4px; }
.notice { padding: 12px 14px; border-radius: var(--radius); background: var(--wait-soft); color: var(--ink); margin-bottom: 14px; border: 1px solid transparent; }
.notice.bad { background: var(--block-soft); }
.notice.info { background: var(--stamp-soft); }
.skel { height: 58px; border-top: 1px solid var(--rule); background: linear-gradient(90deg, var(--sheet) 0%, var(--sheet-2) 50%, var(--sheet) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
.skel:first-child { border-top: 0; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

/* filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.filters input[type="search"] { flex: 1 1 240px; min-width: 0; }
.field input, .field select, .field textarea, .filters input, .filters select { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 10px; width: 100%; }
.filters select { width: auto; }
textarea { resize: vertical; min-height: 96px; line-height: 1.5; }

/* detail */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px 24px; }
.sheet + .sheet { margin-top: 14px; }
@media (max-width: 560px) { .sheet { padding: 16px; } }
.back { display: inline-block; margin-bottom: 12px; font-weight: 500; text-decoration: none; }
.dhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.dtitle { font: 600 1.6rem/1.15 var(--font-head); margin: 0 0 14px; text-wrap: balance; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0 0 16px; font-size: .92rem; }
.meta dt { color: var(--ink-3); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.person { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; }
.person .av { width: 20px; height: 20px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 72ch; }
.ctx { margin-top: 14px; padding: 10px 12px; background: var(--sheet-2); border-radius: var(--radius); font: .84rem/1.6 var(--font-mono); overflow-x: auto; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); align-items: center; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 10px; background: var(--block-soft); border-radius: var(--radius); }
.answer { border-left: 3px solid var(--ok); background: var(--ok-soft); padding: 12px 14px; border-radius: 0 var(--radius) var(--radius) 0; margin-top: 16px; }
.answer h3 { margin: 0 0 6px; font: 600 .78rem var(--font-text); text-transform: uppercase; letter-spacing: .07em; color: var(--ok); }
.thread h2, .sheet h2 { font: 600 1.05rem var(--font-head); margin: 0 0 12px; letter-spacing: .01em; }
.reply { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--rule); }
.reply:first-of-type { border-top: 0; padding-top: 0; }
.reply.accepted { background: linear-gradient(90deg, var(--ok-soft), transparent 70%); }
.reply-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
.reply-head b { font-weight: 600; }
.shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.shots img { max-height: 160px; border-radius: 4px; border: 1px solid var(--rule); }
.history { margin-top: 14px; font-size: .88rem; color: var(--ink-2); }
.history summary { cursor: pointer; font-weight: 500; color: var(--ink); }
.history ol { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; }

/* forms */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-weight: 500; font-size: .9rem; }
.field small { color: var(--ink-3); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.seg { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { font-weight: 500; font-size: .9rem; margin-bottom: 5px; padding: 0; }
.seg label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; background: var(--sheet); }
.seg label:has(input:checked) { border-color: var(--stamp); background: var(--stamp-soft); }
.seg input { accent-color: var(--stamp); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: inline-flex; align-items: center; gap: 6px; background: var(--stamp-soft); color: var(--ink); border-radius: 999px; padding: 3px 4px 3px 4px; font-size: .88rem; }
.pick .av { width: 20px; height: 20px; }
.pick button { border: 0; background: none; cursor: pointer; color: var(--ink-2); padding: 0 6px; font-size: 1rem; line-height: 1; }
.suggest { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); max-height: 220px; overflow: auto; }
.suggest button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; background: none; text-align: left; cursor: pointer; }
.suggest button:hover, .suggest button:focus-visible { background: var(--sheet-2); }
.errors { color: var(--block); font-size: .9rem; margin: 0; padding-left: 18px; }
.form-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.form-foot .muted { margin-right: auto; font-size: .86rem; }

dialog { border: 1px solid var(--rule); border-radius: 10px; padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(16, 20, 26, .45); }
.dlg-in { padding: 20px 22px; overflow: auto; max-height: calc(100dvh - 26px); }
.dlg-in h2 { font: 600 1.35rem var(--font-head); margin: 0 0 14px; }

/* team and prefs */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.stat { background: var(--sheet); padding: 14px 16px; }
.stat b { display: block; font: 600 1.6rem/1.1 var(--font-head); font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-3); font-size: .84rem; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.members { width: 100%; border-collapse: collapse; font-size: .92rem; }
.members th { text-align: left; font-weight: 500; color: var(--ink-3); padding: 0 10px 8px 0; font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; }
.members td { padding: 9px 10px 9px 0; border-top: 1px solid var(--rule); vertical-align: middle; }
.scroll-x { overflow-x: auto; }
.cmd { display: flex; gap: 8px; align-items: stretch; margin: 6px 0 14px; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 9px 11px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: var(--radius); font: .84rem var(--font-mono); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 10px; background: var(--sheet); cursor: pointer; }
.checks input { accent-color: var(--stamp); }
.grouplist { display: grid; gap: 6px; margin-bottom: 10px; }
.grouplist div { display: flex; align-items: center; gap: 10px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 9px 14px; border-radius: var(--radius); font-weight: 500; box-shadow: var(--shadow); z-index: 20; max-width: calc(100vw - 32px); }
.join { max-width: 640px; }
.join h1 { font: 600 2rem/1.1 var(--font-head); margin: 0 0 8px; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
.how div { background: var(--sheet-2); border-radius: var(--radius); padding: 12px; font-size: .9rem; color: var(--ink-2); }
.how b { display: block; color: var(--ink); font-family: var(--font-head); font-size: 1rem; margin-bottom: 2px; }
@media (max-width: 640px) { .how { grid-template-columns: minmax(0, 1fr); } }
</style>

<header class="top"><div class="top-in gutter" id="top"></div></header>
<div class="frame gutter"><nav class="rail" id="nav" aria-label="Inbox views"></nav><main id="main" tabindex="-1"></main></div>
<dialog id="composer" aria-labelledby="composer-title"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

function buildAdmin() {

    fill(errs, ...problems.map((p) => h('li', { text: p }))); errs.hidden = !problems.length;
    if (problems.length) return;
    try { await S.db.doc('config/app').set({ ...(S.config ?? {}), schema: 1, name: name.value.trim(), inboxUrl: link.value.trim(), blockerHours: Number(hours.value) || 24, updatedAt: nowIso(), createdAt: S.config?.createdAt ?? nowIso() }); toast('Settings saved'); }
    catch (err) { toast(errText(err)); }
  } }, h('div', { class: 'row2' }, h('label', { class: 'field' }, h('span', { text: 'Inbox name' }), name), h('label', { class: 'field' }, h('span', { text: 'Highlight blockers older than (hours)' }), hours)),
    h('label', { class: 'field' }, h('span', { text: 'Inbox link' }), link, h('small', { text: 'Copy it from the address bar or Share menu. It goes into every teammate\'s install command.' })), errs, h('div', { class: 'form-foot' }, saveCfg));
  const groupList = h('div', { class: 'grouplist' });
  const slug = h('input', { type: 'text', id: 'a-gslug', placeholder: 'slug, e.g. design', pattern: '[a-z0-9][a-z0-9-]{0,39}', 'aria-label': 'Group slug' });

      confirmArchive

          h('button', { class: 'btn small danger', type: 'button', onclick: async () => { confirmArchive = false; for (const a of old) await deleteAskDeep(a.code); toast(`Archived ${old.length} asks`); } }, 'Yes, delete them'),

async function exportAll() {
  try {
    toast('Preparing backup...');
    const out = { exportedAt: nowIso(), config: S.config, groups: S.groups, members: Object.fromEntries(S.members), asks: [] };
    for (const a of S.asks) {
      const [r, e] = await Promise.all([S.db.collection(`asks/${a.code}/replies`).get(), S.db.collection(`asks/${a.code}/events`).get()]);
      out.asks.push({ ...a, replies: r.docs.map((d) => ({ id: d.id, ...d.data() })), events: e.docs.map((d) => ({ id: d.id, ...d.data() })) });
    }
    await S.downloads.save({ filename: `team-inbox-backup-${today()}.json`, data: JSON.stringify(out, null, 2) });
  } catch (err) { if (err?.code !== 'dismissed' && err?.code !== 'declined') toast(err?.code === 'unavailable' ? 'Downloads are not available here. Use /team-inbox:export in Claude Code.' : errText(err)); }
}
